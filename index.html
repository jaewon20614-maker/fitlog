<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>둘의 가계부</title>
<meta name="theme-color" content="#F7F9F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141714" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="가계부">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
body{margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
img{max-width:100%}
[hidden]{display:none!important}
button{touch-action:manipulation}
/* Layout: flat, airy phone column like a quiet bank app — big numbers, sections split by thin bands, no cards. Bottom line-icon tab bar. */
:root{
  --bg:#F7F9F5; --surface:#FFFFFF; --band:#EDF0EA; --ink:#262B27; --muted:#7C847D; --faint:#B9BFB8; --line:#E3E7E1;
  --mint:#B5F0C8; --mint-ink:#1F6B3A;
  --j:#5B86D6; --j-soft:#E7EEFA; --u:#D9708F; --u-soft:#FAE9EE;
  --inc:#3C9A57; --out:#E2574C; --danger:#D9483D;
  --c-food:#F2A541; --c-move:#5B86D6; --c-shop:#9A7BD8; --c-date:#D9708F; --c-fun:#4DB38A; --c-etc:#E3B94B;
  --f:"Gothic A1",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141714; --surface:#1C201C; --band:#202520; --ink:#E7EBE6; --muted:#98A097; --faint:#5C645B; --line:#2C322C;
  --mint:#2F5C3D; --mint-ink:#B5F0C8; --j:#8AAEF0; --j-soft:#222C3D; --u:#EE9AB3; --u-soft:#3A2630;
  --inc:#6CCB86; --out:#F07D73; --danger:#F07D73;
  --c-food:#F5BB66; --c-move:#8AAEF0; --c-shop:#B9A2EC; --c-date:#EE9AB3; --c-fun:#73CFA6; --c-etc:#EBCB75; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141714; --surface:#1C201C; --band:#202520; --ink:#E7EBE6; --muted:#98A097; --faint:#5C645B; --line:#2C322C;
  --mint:#2F5C3D; --mint-ink:#B5F0C8; --j:#8AAEF0; --j-soft:#222C3D; --u:#EE9AB3; --u-soft:#3A2630;
  --inc:#6CCB86; --out:#F07D73; --danger:#F07D73;
  --c-food:#F5BB66; --c-move:#8AAEF0; --c-shop:#B9A2EC; --c-date:#EE9AB3; --c-fun:#73CFA6; --c-etc:#EBCB75; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:540px;margin:0 auto;padding-block:4px 100px;display:flex;flex-direction:column}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:flex;align-items:center;gap:4px}
.month{display:flex;align-items:center;gap:2px;flex:1;margin-left:-8px}
.month b{font-weight:500;font-size:21px;letter-spacing:-.01em}
.ib{width:36px;height:36px;border:0;background:transparent;border-radius:10px;font-size:22px;color:var(--muted);display:grid;place-items:center}
.ib:hover{background:var(--band)}
.couple{font-size:13px;color:var(--muted);white-space:nowrap}
.couple i{font-style:normal;color:var(--u)}

.sec{padding-block:20px}
.band{height:8px;background:var(--band);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.label{font-size:13px;color:var(--muted)}
.h{font-size:17px;font-weight:500;margin:0 0 12px}
.big{font-size:34px;font-weight:400;letter-spacing:-.02em;line-height:1.15}

/* d-day */
.dday{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dday .big b{font-weight:600}
.dday .meta{font-size:12px;color:var(--muted);text-align:right;line-height:1.6}
.names{font-size:14px;margin-bottom:4px}
.names .j{color:var(--j)} .names .u{color:var(--u)} .names i{font-style:normal;color:var(--faint);margin:0 4px}

/* versus */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.person{padding:14px;border-radius:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.person.j{background:var(--j-soft)} .person.u{background:var(--u-soft)}
.person .who{font-size:13px;font-weight:600}
.person.j .who{color:var(--j)} .person.u .who{color:var(--u)}
.person .out{font-size:21px;font-weight:500;letter-spacing:-.02em}
.person .in{font-size:12px;color:var(--muted)}
.split{height:6px;border-radius:99px;background:var(--band);overflow:hidden;display:flex;margin-top:14px}
.split span{height:100%}
.tot{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.tot b{color:var(--ink);font-weight:500}
.tot .inc b{color:var(--inc)}

/* form */
.form{display:flex;flex-direction:column;gap:16px}
.seg{display:flex;background:var(--band);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px;font-size:14px;color:var(--muted);min-width:0;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.seg.who button[aria-pressed=true].j{color:var(--j)} .seg.who button[aria-pressed=true].u{color:var(--u)}
.amt{display:flex;align-items:baseline;gap:6px;border-bottom:1px solid var(--line);padding-bottom:8px}
.amt:focus-within{border-color:var(--ink)}
.amt input{flex:1;min-width:0;border:0;background:transparent;font-size:34px;font-weight:400;letter-spacing:-.02em;padding:0;outline:none;font-variant-numeric:tabular-nums}
.amt input::placeholder{color:var(--faint)}
.amt span{font-size:17px;color:var(--muted)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:5px 12px;font-size:13px;color:var(--muted)}
.quick button:hover{color:var(--ink);border-color:var(--faint)}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.cats.three{grid-template-columns:repeat(3,1fr)}
.cat{border:0;background:transparent;border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--muted);min-width:0}
.cat .em{width:46px;height:46px;border-radius:50%;background:var(--band);display:grid;place-items:center;font-size:20px;transition:box-shadow .15s}
.cat[aria-pressed=true]{color:var(--ink);font-weight:600}
.cat[aria-pressed=true] .em{background:var(--surface);box-shadow:0 0 0 2px currentColor}
.cat[aria-pressed=true] .em{box-shadow:0 0 0 2px var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>label{flex:1;min-width:120px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label.f input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;font-size:16px;width:100%;min-width:0}
label.f input:focus{outline:none;border-color:var(--ink)}
.save{border:0;background:var(--mint);color:var(--mint-ink);border-radius:14px;padding:14px;font-weight:600;font-size:16px}
.save:disabled{background:var(--band);color:var(--faint);cursor:default}
.sub{font-size:13px;color:var(--muted);margin-bottom:8px}

/* list */
.lhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.lhead h2{font-size:17px;font-weight:500;margin:0}
.lhead span{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.dayhead{font-size:12px;color:var(--muted);padding:14px 0 2px;display:flex;justify-content:space-between}
.dayhead:first-child{padding-top:4px}
.item{display:flex;align-items:center;gap:12px;padding:9px 0}
.ic{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:18px;background:var(--band)}
.item .mid{flex:1;min-width:0}
.item .t{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{font-size:11px;font-weight:600}
.chip.j{color:var(--j)} .chip.u{color:var(--u)} .chip.rec{color:var(--muted);font-weight:500}
.item .a{font-size:15px;font-weight:500;white-space:nowrap}
.item .a.in{color:var(--inc)}
.del{border:0;background:transparent;color:var(--faint);border-radius:8px;height:30px;min-width:28px;font-size:16px;padding:0 6px}
.del:hover{color:var(--muted)}
.del.armed{background:var(--danger);color:#fff;font-size:12px}
.empty{color:var(--muted);font-size:14px;padding:16px 0;line-height:1.7;text-align:center}
.empty .big{display:none}

/* calendar */
.calhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.calhead .pm{text-align:right;font-size:14px;line-height:1.5}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px}
.dow{text-align:center;font-size:13px;color:var(--ink);padding:0 0 8px}
.d{border:0;background:transparent;min-height:62px;padding:6px 1px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.d.out{visibility:hidden}
.d .n{font-size:14px;line-height:1.4}
.d .sp{font-size:10.5px;color:var(--out);letter-spacing:-.03em;white-space:nowrap;overflow:hidden;max-width:100%}
.d .ip{font-size:10px;color:var(--inc);letter-spacing:-.03em;white-space:nowrap;overflow:hidden;max-width:100%}
.d.today .n{font-weight:700}
.d.sel{background:var(--mint)}
.d .bar{width:60%;height:3px;border-radius:2px;margin-top:auto;display:flex;overflow:hidden}
.d .bar span{height:100%}
.pill{border:1px solid var(--line);background:transparent;border-radius:99px;padding:5px 12px;font-size:13px;color:var(--ink)}
.pill:hover{border-color:var(--faint)}

/* stats */
.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.donut{width:170px;max-width:100%;aspect-ratio:1;position:relative;flex:none}
.donut svg{width:100%;height:100%;display:block}
.donut .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donut .ctr span{font-size:12px;color:var(--muted)}
.donut .ctr b{font-weight:500;font-size:20px;line-height:1.3}
.legend{flex:1;min-width:210px;display:flex;flex-direction:column;gap:6px}
.lg{display:flex;align-items:center;gap:12px;padding:4px 0}
.lg .ic{width:40px;height:40px;font-size:17px}
.lg .nm{flex:1;display:flex;flex-direction:column;font-size:15px;line-height:1.35}
.lg .pct{font-size:13px;color:var(--muted)}
.lg .v{font-size:15px}
.lg .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:1px}
.cmp{display:flex;flex-direction:column;gap:12px}
.cmp-row{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;font-size:13px}
.cmp-row .bars{display:flex;flex-direction:column;gap:3px}
.cmp-row .b{height:6px;border-radius:99px;min-width:2px}
.cmp-row .bl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.rec-add{display:flex;flex-direction:column;gap:14px;margin-top:14px;padding-top:16px;border-top:1px solid var(--line)}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin:0}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:12px;color:var(--faint)}
nav.tabs svg{width:24px;height:24px}
nav.tabs button[aria-current=page]{color:var(--ink);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:13px;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.gear{width:36px;height:36px;border:0;background:transparent;border-radius:10px;color:var(--muted);display:grid;place-items:center}
.gear svg{width:22px;height:22px}
.onb{display:flex;flex-direction:column;gap:14px;padding-block:28px}
.onb h1{font-size:28px;font-weight:500;letter-spacing:-.02em;margin:0;line-height:1.3}
.onb p{margin:0;color:var(--muted);font-size:14px;line-height:1.7}
.code{font-size:30px;font-weight:600;letter-spacing:.12em;text-align:center;padding:18px;border-radius:14px;background:var(--surface);border:1px solid var(--line);user-select:all;-webkit-user-select:all}
.codein{width:100%;font-size:24px;font-weight:600;letter-spacing:.12em;text-align:center;text-transform:uppercase;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.codein:focus{outline:none;border-color:var(--ink)}
.ghost{border:1px solid var(--line);background:transparent;border-radius:14px;padding:13px;font-size:15px;font-weight:500}
.or{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:540px;border-radius:18px 18px 0 0;padding:22px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-size:18px;font-weight:600}
.danger-link{border:0;background:none;color:var(--danger);font-size:13px;padding:6px}
</style>
</head>

</div></nav>

(function(){

function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function nextM(m){const[y,mo]=m.split("-").map(Number);return ymd(new Date(y,mo,1)).slice(0,7)}
function won(n){return Math.round(n).toLocaleString("ko-KR")}
function short(n){if(n<10000)return won(n);const m=n/10000;return(m>=100?Math.round(m):Math.round(m*10)/10)+"만"}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

const who=e=>e.who==="u"?"u":"j";

  form:{type:"out",cat:"food",amount:"",date:today(),who:"j",memo:""},

  statWho:"all",armed:null,saving:false};

/* ---------- Firebase ---------- */
const firebaseConfig={apiKey:"AIzaSyDdN94co-rlDGlOM8MJryCdcNwf94QseuQ",authDomain:"couple-c9333.firebaseapp.com",projectId:"couple-c9333",storageBucket:"couple-c9333.firebasestorage.app",messagingSenderId:"402343574231",appId:"1:402343574231:web:efe7845b311f1a10064e92"};
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let fdb=null,unsubs=[];
S.code=LS.get("ledger-code");S.meSlot=LS.get("ledger-me")||"j";S.form.who=S.meSlot;S.rf.who=S.meSlot;S.authErr=false;S.onb={mode:"start",busy:false,err:""};
const col=c=>fdb.collection("couples").doc(S.code).collection(c);
async function setDoc(c,id,data){return col(c).doc(id).set(data)}
async function delDoc(c,id){return col(c).doc(id).delete()}
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function newCode(){const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let c="";const r=crypto.getRandomValues(new Uint32Array(8));for(let i=0;i<8;i++)c+=A[r[i]%A.length];return c}
const fmtCode=c=>c?c.slice(0,4)+"-"+c.slice(4):"";

function subscribe(){
  unsubs.forEach(u=>u());unsubs=[];S.ready=false;S.recReady=false;render();
  const t=setTimeout(()=>{if(!S.ready){S.ready=true;toast("연결이 느려요. 인터넷을 확인해 주세요");render()}},10000);
  const lost=e=>{clearTimeout(t);if(e&&e.code==="permission-denied"){toast("이 코드에 연결할 수 없어요. 다시 연결해 주세요");leave()}else{S.ready=true;toast("기록을 불러오지 못했어요");render()}};
  unsubs.push(col("entries").onSnapshot(snap=>{S.entries=snap.docs.map(d=>Object.assign({id:d.id},d.data()));clearTimeout(t);S.ready=true;ensureRec();render()},lost));
  unsubs.push(col("recurring").onSnapshot(snap=>{S.recs=snap.docs.map(d=>Object.assign({id:d.id},d.data()));S.recReady=true;ensureRec();render()},lost));
}
function leave(){unsubs.forEach(u=>u());unsubs=[];LS.del("ledger-code");S.code=null;S.entries=[];S.recs=[];S.ready=false;S.onb={mode:"start",busy:false,err:""};render()}
async function createCouple(){
  S.onb.busy=true;S.onb.err="";render();
  for(let i=0;i<3;i++){const c=newCode();
    try{await fdb.collection("couples").doc(c).set({members:[S.me],createdAt:Date.now()});
      S.code=c;LS.set("ledger-code",c);S.meSlot="j";LS.set("ledger-me","j");S.form.who=S.rf.who="j";S.onb={mode:"created",busy:false,err:""};subscribe();return}catch(e){}}
  S.onb.busy=false;S.onb.err="코드를 만들지 못했어요. 인터넷과 Firebase 설정을 확인해 주세요.";render();
}
async function joinCouple(raw){
  const c=String(raw||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(c.length!==8){S.onb.err="코드 8자리를 입력해 주세요.";render();return}
  S.onb.busy=true;S.onb.err="";render();
  try{await fdb.collection("couples").doc(c).update({members:firebase.firestore.FieldValue.arrayUnion(S.me)});
    S.code=c;LS.set("ledger-code",c);S.meSlot="u";LS.set("ledger-me","u");S.form.who=S.rf.who="u";S.onb={mode:"start",busy:false,err:""};subscribe();toast("연결됐어요")}
  catch(e){S.onb.busy=false;S.onb.err=e&&e.code==="not-found"?"없는 코드예요. 다시 확인해 주세요.":"연결하지 못했어요. 코드를 확인해 주세요.";render()}
}
async function init(){
  S.mode="db";
  try{
    firebase.initializeApp(firebaseConfig);fdb=firebase.firestore();
    try{await fdb.enablePersistence({synchronizeTabs:true})}catch(e){}
    const cred=await firebase.auth().signInAnonymously();S.me=cred.user.uid;
  }catch(e){S.authErr=true;render();return}
  if(S.code)subscribe();else render();
}
async function shareCode(){
  const text=`우리 가계부 커플 코드: ${fmtCode(S.code)}\n${location.origin+location.pathname}`;
  try{if(navigator.share){await navigator.share({text});return}}catch(e){if(e&&e.name==="AbortError")return}
  try{await navigator.clipboard.writeText(text);toast("코드를 복사했어요")}catch(e){toast("코드를 길게 눌러 복사해 주세요")}
}

/* ---------- 고정지출 자동 등록 ---------- */
const tried=new Set();
function ensureRec(){
  if(!S.ready||!S.recReady)return;
  const t=today(),curM=t.slice(0,7),curD=+t.slice(8);
  S.recs.forEach(r=>{
    let m=r.start||curM,guard=0;
    while(m<=curM&&guard++<36){
      const[y,mo]=m.split("-").map(Number),d=Math.min(+r.day||1,new Date(y,mo,0).getDate());
      if(m<curM||d<=curD){
        const id="rec_"+r.id+"_"+m;
        if(!(r.skip||[]).includes(m)&&!S.entries.some(e=>e.id===id)&&!tried.has(id)){
          tried.add(id);
          setDoc("entries",id,{type:r.type||"out",cat:r.cat,amount:+r.amount,date:m+"-"+String(d).padStart(2,"0"),who:r.who,memo:r.title||"",by:"auto",rec:r.id,at:Date.now()}).catch(()=>tried.delete(id));
        }
      }
      m=nextM(m);
    }
  });
}

const outs=l=>l.filter(e=>e.type!=="in"),ins=l=>l.filter(e=>e.type==="in");
function itemHTML(e){
  const c=CAT[e.cat]||{label:e.cat,em:"•"},inc=e.type==="in",w=who(e);
  return `<div class="item"><span class="ic">${c.em}</span>
  <div class="mid"><div class="t">${esc(e.memo||c.label)}</div><div class="s"><span>${esc(c.label)}</span><span class="chip ${w}">${PEOPLE[w]}</span>${e.rec?'<span class="chip rec">· 고정</span>':""}</div></div>

function groupList(list,limit){
  list=list.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.at||0)-(a.at||0));
  if(limit)list=list.slice(0,limit);
  let h="",cur="";
  list.forEach(e=>{if(e.date!==cur){cur=e.date;const d=new Date(cur+"T00:00"),s=sum(outs(list.filter(x=>x.date===cur)));
    h+=`<div class="dayhead"><span>${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})</span><span class="num">${s?"-"+won(s):""}</span></div>`}
    h+=itemHTML(e)});

}

const MET=new Date(2021,3,9);
function together(){const t=new Date();t.setHours(0,0,0,0);return Math.round((t-MET)/864e5)+1}
function nextMilestone(n){
  const c=[];const hund=Math.ceil((n+1)/100)*100;c.push({label:hund+"일",days:hund-n});
  const t=new Date();t.setHours(0,0,0,0);let y=t.getFullYear();let an=new Date(y,3,9);if(an<t)an=new Date(++y,3,9);
  c.push({label:(y-2021)+"주년",days:Math.round((an-t)/864e5),today:+an===+t});
  return c.sort((a,b)=>a.days-b.days)[0];
}

/* ---------- 통계 ---------- */
function donut(rows,total){
  const R=70,C=2*Math.PI*R;let off=0,segs="";
  if(total>0)rows.forEach(r=>{const len=r.v/total*C,gap=rows.length>1?Math.min(2.5,len*.3):0;
    segs+=`<circle cx="90" cy="90" r="${R}" fill="none" stroke="${r.color}" stroke-width="20" stroke-dasharray="${Math.max(len-gap,0.01)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"/>`;off+=len});
  return `<svg viewBox="0 0 180 180" role="img" aria-label="카테고리별 지출 비율"><circle cx="90" cy="90" r="${R}" fill="none" stroke="var(--band)" stroke-width="20"/>${segs}</svg>`;
}

  const max=Math.max(1,...OUT.map(([k])=>Math.max(sum(me.filter(e=>e.cat===k&&who(e)==="j")),sum(me.filter(e=>e.cat===k&&who(e)==="u")))));
  const cmp=OUT.map(([k,l])=>{const a=sum(me.filter(e=>e.cat===k&&who(e)==="j")),b=sum(me.filter(e=>e.cat===k&&who(e)==="u"));

  const recTotal=sum(S.recs.filter(r=>r.type!=="in"));
  const recList=S.recs.slice().sort((a,b)=>(+a.day)-(+b.day)).map(r=>{const c=CAT[r.cat]||{label:r.cat,em:"•"},w=r.who==="u"?"u":"j";
    return `<div class="item"><span class="ic">${c.em}</span><div class="mid"><div class="t">${esc(r.title||c.label)}</div><div class="s"><span>매월 ${+r.day}일</span><span class="chip ${w}">${PEOPLE[w]}</span></div></div>
    <span class="a num ${r.type==="in"?"in":""}">${r.type==="in"?"+":"-"}${won(r.amount)}</span><button class="del ${S.armed==="r_"+r.id?"armed":""}" data-act="rdel" data-id="${r.id}" aria-label="고정지출 삭제">${S.armed==="r_"+r.id?"삭제":"×"}</button></div>`}).join("");
  const rf=S.rf,ramt=+String(rf.amount).replace(/\D/g,"")||0,rOut=rf.type==="out";
  return `<section class="sec"><div class="label">${mLabel()} ${sw==="all"?"둘이":PEOPLE[sw]} 지출</div><div class="big num" style="margin-bottom:14px">${won(total)}원</div>
    <div class="seg" role="group" aria-label="누구">${[["all","둘이"],["j","재식"],["u","우탄"]].map(([k,l])=>`<button type="button" data-act="sw" data-v="${k}" aria-pressed="${sw===k}">${l}</button>`).join("")}</div>
    ${total?`<div class="donut-wrap"><div class="donut">${donut(rows,total)}<div class="ctr"><span>1위</span><b>${rows[0].l}</b></div></div>
    <div class="legend">${rows.map(r=>`<div class="lg"><span class="ic">${r.em}</span><span class="nm"><span><i class="dot" style="background:${r.color}"></i>${r.l}</span><span class="pct num">${Math.round(r.v/total*100)}%</span></span><span class="v num">${won(r.v)}</span></div>`).join("")}</div></div>`
    :`<div class="empty">${mLabel()} 지출이 생기면 그래프가 그려져요.</div>`}
  </section>
  ${sum(me)?`${BAND}<section class="sec"><h2 class="h">카테고리별 재식 vs 우탄</h2><div class="cmp">${cmp}</div></section>`:""}
  ${BAND}
  <section class="sec"><h2 class="h" style="margin-bottom:4px">고정지출</h2>
    <p class="note">매달 정한 날짜에 내역에 자동으로 들어가요. 그 달만 빼려면 내역에서 지우면 돼요.</p>
    ${S.recs.length?`<div class="list" style="margin-top:8px">${recList}</div><div class="tot"><span>매달 나가는 돈</span><b class="num">${won(recTotal)}원</b></div>`:`<div class="empty">월세, 구독료, 데이트 통장처럼 매달 나가는 돈을 등록해 보세요.</div>`}
    ${rf.open?`<form class="rec-add" id="recForm" autocomplete="off">
      <div class="seg" role="group"><button type="button" data-act="rtype" data-v="out" aria-pressed="${rOut}">지출</button><button type="button" data-act="rtype" data-v="in" aria-pressed="${!rOut}">수입</button></div>
      <label class="f">이름<input type="text" id="rTitle" placeholder="${rOut?"예: 넷플릭스, 데이트 통장":"예: 월급"}" value="${esc(rf.title)}" maxlength="30"></label>
      <div class="row"><label class="f">금액<input type="text" id="rAmount" inputmode="numeric" placeholder="17,000" value="${ramt?won(ramt):""}"></label><label class="f" style="max-width:120px">매월 며칠<input type="number" id="rDay" inputmode="numeric" min="1" max="31" value="${esc(rf.day)}"></label></div>
      <div class="cats ${rOut?"":"three"}" role="group" aria-label="카테고리">${catButtons(rOut?OUT:INC,rf.cat,"rcat")}</div>
      ${whoSeg(rf.who,"rwho")}
      <div class="row"><button type="button" class="pill" data-act="ropen" style="flex:0 0 auto">취소</button><button class="save" type="submit" style="flex:1" ${ramt&&+rf.day>=1&&+rf.day<=31?"":"disabled"}>등록</button></div>
    </form>`:`<button class="pill" data-act="ropen" style="margin-top:12px;width:100%;padding:11px">+ 고정지출 추가</button>`}
  </section>`
}

function render(){
  const [y,m]=S.month.split("-").map(Number);$("#mLabel").textContent=(y===new Date().getFullYear()?"":y+"년 ")+m+"월";
  document.querySelectorAll("nav.tabs button").forEach(b=>{if(b.dataset.tab===S.tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  const paired=!!S.code&&S.onb.mode!=="created";
  $("#tabs").hidden=!paired;$("#gear").hidden=!S.code;document.querySelector(".month").style.visibility=paired?"visible":"hidden";
  if(!S.code||S.authErr){$("#view").innerHTML=vOnboard();return}
  if(S.onb.mode==="created"){$("#view").innerHTML=vCreated();return}
  if(!S.ready){$("#view").innerHTML='<div class="empty">기록을 불러오는 중이에요…</div>';return}
  const fid=document.activeElement&&document.activeElement.id;
  $("#view").innerHTML=S.tab==="input"?vInput():S.tab==="cal"?vCal():vStats();
  if(fid){const el=document.getElementById(fid);if(el&&el.tagName==="INPUT"){el.focus();if(el.type==="text")try{const L=el.value.length;el.setSelectionRange(L,L)}catch(e){}}}
}

/* ---------- events ---------- */
document.addEventListener("click",async ev=>{
  const tb=ev.target.closest("nav.tabs button");if(tb){S.tab=tb.dataset.tab;S.armed=null;render();scrollTo(0,0);return}
  const t=ev.target.closest("[data-act]");if(!t){if(S.armed){S.armed=null;render()}return}
  const a=t.dataset.act,f=S.form,rf=S.rf;
  if(a!=="del"&&a!=="rdel")S.armed=null;
  if(a==="type"){f.type=t.dataset.v;f.cat=f.type==="out"?"food":"pay";render()}
  else if(a==="cat"){f.cat=t.dataset.v;render()}
  else if(a==="who"){f.who=t.dataset.v;render()}
  else if(a==="plus"){const cur=+String(f.amount).replace(/\D/g,"")||0,v=+t.dataset.v;f.amount=String(v?cur+v:0);render()}
  else if(a==="del"){const id=t.dataset.id;if(S.armed!==id){S.armed=id;render();return}S.armed=null;
    const e=S.entries.find(x=>x.id===id);
    try{await delDoc("entries",id);
      if(e&&e.rec){const r=S.recs.find(x=>x.id===e.rec);if(r){const m=e.date.slice(0,7),skip=[...new Set([...(r.skip||[]),m])];const{id:_,...rest}=r;await setDoc("recurring",r.id,Object.assign(rest,{skip}))}}
      toast("삭제했어요")}catch(err){toast("삭제하지 못했어요. 권한을 확인해 줘")}render()}
  else if(a==="day"){S.sel=t.dataset.v;render()}
  else if(a==="addOn"){f.date=t.dataset.v;S.tab="input";render();scrollTo(0,0);setTimeout(()=>{const i=$("#amount");if(i)i.focus()},50)}
  else if(a==="sw"){S.statWho=t.dataset.v;render()}
  else if(a==="ropen"){rf.open=!rf.open;render()}
  else if(a==="rtype"){rf.type=t.dataset.v;rf.cat=rf.type==="out"?"shop":"pay";render()}
  else if(a==="rcat"){rf.cat=t.dataset.v;render()}
  else if(a==="rwho"){rf.who=t.dataset.v;render()}
  else if(a==="rdel"){const id=t.dataset.id;if(S.armed!=="r_"+id){S.armed="r_"+id;render();return}S.armed=null;
    try{await delDoc("recurring",id);toast("고정지출을 멈췄어요. 지난 기록은 그대로예요")}catch(e){toast("삭제하지 못했어요")}render()}
});
document.addEventListener("input",ev=>{
  const id=ev.target.id,f=S.form,rf=S.rf;
  if(id==="amount"){const raw=ev.target.value.replace(/\D/g,"").slice(0,10);f.amount=raw;ev.target.value=raw?won(+raw):"";
    const b=$("#entryForm .save");if(b){const n=+raw||0;b.disabled=!n||S.saving;b.textContent=n?`${won(n)}원 저장`:"금액을 입력하세요"}}
  else if(id==="memo")f.memo=ev.target.value;
  else if(id==="date")f.date=ev.target.value||today();
  else if(id==="rTitle")rf.title=ev.target.value;
  else if(id==="rAmount"||id==="rDay"){
    if(id==="rAmount"){const raw=ev.target.value.replace(/\D/g,"").slice(0,10);rf.amount=raw;ev.target.value=raw?won(+raw):""}else rf.day=ev.target.value;
    const b=$("#recForm .save");if(b)b.disabled=!(+rf.amount>0&&+rf.day>=1&&+rf.day<=31)}
});
document.addEventListener("submit",async ev=>{
  ev.preventDefault();
  if(ev.target.id==="entryForm"){
    if(S.saving)return;const f=S.form,amount=+String(f.amount).replace(/\D/g,"")||0;if(!amount)return;
    const e={type:f.type,cat:f.cat,amount,date:f.date||today(),who:f.who,by:S.me,memo:(f.memo||"").trim(),at:Date.now()};
    S.saving=true;render();
    try{await setDoc("entries",rid(),e);f.amount="";f.memo="";if(e.date.slice(0,7)!==S.month)S.month=e.date.slice(0,7);toast(`${CAT[e.cat].label} ${won(amount)}원 저장했어요`)}
    catch(err){toast(err&&err.code==="not_granted"?"저장 권한이 없어요. 공유 권한을 확인해 줘":"저장하지 못했어요. 다시 해 줘")}
    S.saving=false;render();
  }
  if(ev.target.id==="recForm"){
    const rf=S.rf,amount=+rf.amount||0,day=Math.round(+rf.day);if(!amount||day<1||day>31)return;
    const r={type:rf.type,cat:rf.cat,amount,day,who:rf.who,title:(rf.title||"").trim(),start:today().slice(0,7),skip:[],by:S.me,at:Date.now()};
    try{await setDoc("recurring",rid(),r);Object.assign(rf,{open:false,amount:"",title:""});toast("고정지출을 등록했어요")}
    catch(e){toast("등록하지 못했어요. 다시 해 줘")}
    render();
  }
});
function moveMonth(n){const[y,m]=S.month.split("-").map(Number);S.month=ymd(new Date(y,m-1+n,1)).slice(0,7);
  if(!S.sel.startsWith(S.month))S.sel=S.month===today().slice(0,7)?today():S.month+"-01";S.armed=null;render()}
$("#mPrev").onclick=()=>moveMonth(-1);$("#mNext").onclick=()=>moveMonth(1);

render();init();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
</script>
</body>
</html>
