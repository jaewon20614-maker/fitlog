<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오늘의 운동식단</title>
<meta name="theme-color" content="#F2F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="운동식단">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
body{margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
img{max-width:100%}
[hidden]{display:none!important}
button{touch-action:manipulation}
/* Layout: one-column phone log, fixed bottom tab bar, day switcher pinned at top */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --ink:#18201E; --muted:#66706C; --line:#DCE1DD;
  --accent:#2C4FD1; --accent-soft:#E3E8FB; --meal:#C97A0E; --meal-soft:#FBEFDC;
  --water:#1C8FC4; --water-soft:#DDF0F8; --danger:#C2412D;
  --f-display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1B201E; --ink:#E8ECEA; --muted:#97A19D; --line:#2C3330;
  --accent:#7D95F2; --accent-soft:#232C4C; --meal:#E8A54A; --meal-soft:#3A2D18;
  --water:#5BBDE6; --water-soft:#17323F; --danger:#EC7B67; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1B201E; --ink:#E8ECEA; --muted:#97A19D; --line:#2C3330;
  --accent:#7D95F2; --accent-soft:#232C4C; --meal:#E8A54A; --meal-soft:#3A2D18;
  --water:#5BBDE6; --water-soft:#17323F; --danger:#EC7B67; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-block:8px 110px;display:flex;flex-direction:column;gap:14px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;display:flex;align-items:center;gap:8px}
.brand{font-family:var(--f-display);font-size:24px;letter-spacing:.01em;flex:1;line-height:1.1}
.brand small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);letter-spacing:0}
.status{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.daybar{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px}
.daybar .lbl{flex:1;text-align:center}
.daybar .lbl b{font-family:var(--f-display);font-weight:400;font-size:22px;display:block;line-height:1.15}
.daybar .lbl span{font-size:12px;color:var(--muted)}
.iconbtn{width:40px;height:40px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center;font-size:20px;color:var(--muted)}
.iconbtn:hover{background:var(--bg)}
.todaybtn{font-size:12px;border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 8px;color:var(--accent)}

h2.sec{font-family:var(--f-display);font-weight:400;font-size:20px;margin:6px 0 0;display:flex;align-items:baseline;gap:8px}
h2.sec .count{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.muted{color:var(--muted)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* summary */
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;border:0;text-align:left}
.stat .k{font-size:12px;font-weight:600;letter-spacing:.04em}
.stat .v{font-family:var(--f-display);font-size:30px;line-height:1.1}
.stat .v small{font-family:var(--f-body);font-size:13px;margin-left:2px}
.stat .d{font-size:12px;color:var(--muted)}
.stat.w{background:var(--accent-soft)} .stat.w .k{color:var(--accent)}
.stat.m{background:var(--meal-soft)} .stat.m .k{color:var(--meal)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);background:transparent;border:0;padding:0}
.slot .pic{width:100%;aspect-ratio:1;max-width:100%;border-radius:10px;border:1.5px dashed var(--line);display:grid;place-items:center;overflow:hidden;font-size:18px;color:var(--line)}
.slot.on .pic{border:1.5px solid var(--meal);background:var(--meal-soft);color:var(--meal)}
.slot .pic img{width:100%;height:100%;object-fit:cover}
.slot.on{color:var(--ink)}

/* water */
.water-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.water-head .big{font-family:var(--f-display);font-size:28px;color:var(--water)}
.cups{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:10px}
.cup{aspect-ratio:3/4;max-width:100%;border:1.5px solid var(--water);border-radius:4px 4px 9px 9px;background:transparent;position:relative;overflow:hidden;padding:0}
.cup::after{content:"";position:absolute;inset:auto 0 0;height:0;background:var(--water);transition:height .25s}
.cup.on::after{height:78%}
.cup.extra{border-style:dashed}
.water-ctl{display:flex;gap:8px;margin-top:10px}
.water-ctl button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px;font-size:14px}
.water-ctl button.add{background:var(--water);color:#fff;border-color:var(--water)}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:13px;color:var(--muted)}
.badge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.del{border:0;background:transparent;color:var(--muted);font-size:18px;width:34px;height:34px;border-radius:8px}
.del:hover{color:var(--danger);background:var(--bg)}
.thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none;border:0;padding:0;background:var(--bg);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

/* forms */
.form{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:0}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:500}
input[type=text],input[type=number]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px}
input:focus{border-color:var(--accent);outline:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:5px 11px;font-size:13px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.primary{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:11px;font-weight:600;font-size:15px}
.primary.meal{background:var(--meal)}
.primary:disabled{opacity:.5}
.photo-pick{display:flex;align-items:center;gap:10px}
.photo-pick label.btn{border:1px dashed var(--line);border-radius:10px;padding:9px 12px;font-size:14px;color:var(--muted);cursor:pointer;flex:1;text-align:center}
.photo-pick input{position:absolute;opacity:0;width:1px;height:1px}
.photo-pick .pv{width:46px;height:46px;border-radius:8px;object-fit:cover}
.meal-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.meal-tabs button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;font-size:14px}
.meal-tabs button[aria-pressed=true]{background:var(--meal);border-color:var(--meal);color:#fff;font-weight:600}
.meal-tabs button .n{font-family:var(--f-num);font-size:11px;opacity:.75;margin-left:2px}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between}
.cal-head b{font-family:var(--f-display);font-weight:400;font-size:22px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal .dow{text-align:center;font-size:11px;color:var(--muted);padding:4px 0}
.cal .dow:first-child{color:var(--danger)}
.day{aspect-ratio:1;max-width:100%;border:0;background:transparent;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--f-num);font-size:13px;padding:0}
.day:hover{background:var(--bg)}
.day.out{visibility:hidden}
.day.sel{background:var(--ink);color:var(--bg)}
.day.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.dots{display:flex;gap:3px;height:6px}
.dot{width:6px;height:6px;border-radius:50%}
.dot.w{background:var(--accent)} .dot.m{background:var(--meal)} .dot.h{background:var(--water)}
.day.sel .dot{box-shadow:0 0 0 1px var(--bg)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.month-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.month-stats div b{display:block;font-family:var(--f-display);font-weight:400;font-size:26px}
.month-stats div span{font-size:12px;color:var(--muted)}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current=page]{color:var(--accent);font-weight:600}

.overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.82);display:grid;place-items:center;padding:24px}
.overlay img{max-height:85vh;border-radius:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:13px}
.loading{text-align:center;padding:60px 0;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.status{cursor:pointer}
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.sheet h3{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0}
.sheet p{margin:0;font-size:14px;color:var(--muted)}
.sheet .ghost{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px;font-weight:600;font-size:15px;text-align:center;cursor:pointer}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">오늘의 운동식단<small>운동 · 식단 · 물 기록</small></div>
    <button class="status" id="status" type="button">백업</button>
  </header>
  <div class="daybar" id="daybar">
    <button class="iconbtn" id="prevDay" aria-label="이전 날">‹</button>
    <div class="lbl"><b id="dayTitle">오늘</b><span id="daySub"></span></div>
    <button class="todaybtn" id="goToday" hidden>오늘로</button>
    <button class="iconbtn" id="nextDay" aria-label="다음 날">›</button>
  </div>
  <main id="view"><div class="loading">기록을 불러오는 중이에요…</div></main>
</div>

<nav class="tabs" aria-label="화면">
  <div class="in">
    <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>오늘</button>
    <button data-tab="workout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12h2M20 12h2M6 7v10M18 7v10M4 9v6M20 9v6M6 12h12"/></svg>운동</button>
    <button data-tab="meal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v5M9 3v5M17 3c-2 0-3 3-3 6s1 4 3 4v8"/></svg>식단</button>
    <button data-tab="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>캘린더</button>
  </div>
</nav>

<script>
(function(){
const MEALS=[["breakfast","아침"],["lunch","점심"],["dinner","저녁"],["snack","간식"]];
const CUP_ML=250, CUP_GOAL=8;
const QUICK=["스쿼트","벤치프레스","데드리프트","풀업","푸시업","플랭크","러닝","사이클"];
const CARDIO=new Set(["러닝","사이클","걷기","플랭크","줄넘기","수영","등산"]);
const DOW=["일","월","화","수","목","금","토"];

const S={tab:"today",date:ymd(new Date()),days:{},mode:null,db:null,assets:null,uid:null,
  wType:"strength",mealSlot:"breakfast",pendingPhoto:null,calMonth:null,busy:false};

function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parse(s){const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)}
function shift(s,n){const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)}
function uid(){return Math.random().toString(36).slice(2,10)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function blank(){return{workouts:[],meals:{breakfast:[],lunch:[],dinner:[],snack:[]},water:0}}
function day(d){const v=S.days[d];if(!v)return blank();const b=blank();return{workouts:v.workouts||[],meals:Object.assign(b.meals,v.meals||{}),water:v.water||0}}
function photoSrc(m){return m.photoUrl||(m.photoId?"/_blob/"+m.photoId:m.photoData||"")}
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),1800)}
const $=s=>document.querySelector(s);

/* ---------- storage (이 기기 IndexedDB) ---------- */
const LKEY="fitlog-days-v1",DBN="fitlog",ST="days";let idb=null;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idbAll(){return new Promise((res,rej)=>{const out={},tx=idb.transaction(ST),c=tx.objectStore(ST).openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue()}else res(out)};c.onerror=()=>rej(c.error)})}
function idbPut(k,v){return new Promise((res,rej)=>{const tx=idb.transaction(ST,"readwrite");tx.objectStore(ST).put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
function loadLocal(){try{return JSON.parse(localStorage.getItem(LKEY)||"{}")}catch(e){return{}}}
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify(S.days))}catch(e){toast("저장 공간이 부족해요. 백업 후 사진 일부를 지워 주세요")}}
function persist(d){
  const data=JSON.parse(JSON.stringify(day(d)));
  if(idb)idbPut(d,data).catch(()=>toast("저장하지 못했어요. 다시 시도해 주세요"));else saveLocal();
}
function mutate(fn){const d=S.date;const v=day(d);fn(v);S.days[d]=v;persist(d);render()}

async function init(){
  S.mode="local";
  try{idb=await openDB();S.days=await idbAll();
    const old=loadLocal();for(const k in old)if(!S.days[k]){S.days[k]=old[k];idbPut(k,old[k])}
  }catch(e){idb=null;S.days=loadLocal()}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  render();
}

/* ---------- backup ---------- */
function openBackup(){
  let last="";try{last=localStorage.getItem("fitlog-last-backup")||""}catch(e){}
  const n=Object.keys(S.days).length;
  const bg=document.createElement("div");bg.className="sheet-bg";
  bg.innerHTML=`<div class="sheet" role="dialog" aria-label="백업"><h3>백업</h3>
  <p>기록은 이 폰 안에만 저장돼요. 폰을 바꾸거나 Safari 데이터를 지우기 전에 백업 파일을 저장해 두세요.</p>
  <p class="num">기록된 날 ${n}일${last?" · 마지막 백업 "+esc(last):""}</p>
  <button class="primary" type="button" id="bkExport">백업 파일 저장</button>
  <label class="ghost" for="bkImport">백업 파일 불러오기</label><input type="file" id="bkImport" accept=".json,application/json" hidden>
  <button class="ghost" type="button" id="bkClose">닫기</button></div>`;
  bg.addEventListener("click",e=>{if(e.target===bg||e.target.id==="bkClose")bg.remove()});
  document.body.appendChild(bg);
  bg.querySelector("#bkExport").onclick=async()=>{
    const today=ymd(new Date());
    const json=JSON.stringify({app:"fitlog",version:1,exported:new Date().toISOString(),days:S.days});
    const file=new File([json],"운동식단-백업-"+today+".json",{type:"application/json"});
    try{
      if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:"운동식단 백업"});
      else{const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
      try{localStorage.setItem("fitlog-last-backup",today)}catch(e){}
      bg.remove();toast("백업 파일을 만들었어요");
    }catch(e){if(e&&e.name!=="AbortError")toast("백업 파일을 만들지 못했어요")}
  };
  bg.querySelector("#bkImport").onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{const o=JSON.parse(await f.text());if(!o||o.app!=="fitlog"||!o.days)throw 0;
      let cnt=0;
      for(const k in o.days){const cur=day(k),inc=o.days[k];const ids=new Set(cur.workouts.map(w=>w.id));
        (inc.workouts||[]).forEach(w=>{if(!ids.has(w.id))cur.workouts.push(w)});
        MEALS.forEach(([q])=>{const mids=new Set(cur.meals[q].map(m=>m.id));((inc.meals||{})[q]||[]).forEach(m=>{if(!mids.has(m.id))cur.meals[q].push(m)})});
        cur.water=Math.max(cur.water,inc.water||0);S.days[k]=cur;persist(k);cnt++}
      bg.remove();render();toast(cnt+"일치 기록을 불러왔어요");
    }catch(_){toast("운동식단 백업 파일이 아니에요")}
  };
}
document.addEventListener("click",e=>{if(e.target.closest("#status"))openBackup()});

/* ---------- photos ---------- */
function shrink(file,max,q){return new Promise((res,rej)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);c.toBlob(b=>b?res({blob:b,dataUrl:c.toDataURL("image/jpeg",q)}):rej(),"image/jpeg",q)};
  img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url;})}

/* ---------- render ---------- */
function render(){
  if(!S.mode)return;
  const isToday=S.date===ymd(new Date()),d=parse(S.date);
  $("#dayTitle").textContent=isToday?"오늘":S.date===shift(ymd(new Date()),-1)?"어제":(d.getMonth()+1)+"월 "+d.getDate()+"일";
  $("#daySub").textContent=d.getFullYear()+"년 "+(d.getMonth()+1)+"월 "+d.getDate()+"일 ("+DOW[d.getDay()]+")";
  $("#goToday").hidden=isToday;
  $("#daybar").hidden=S.tab==="cal";
  document.querySelectorAll("nav.tabs button").forEach(b=>{if(b.dataset.tab===S.tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  const v=$("#view");
  const keep=document.activeElement&&document.activeElement.id;const vals={};
  v.querySelectorAll("input[type=text],input[type=number]").forEach(i=>vals[i.id]=i.value);
  v.innerHTML=S.tab==="today"?vToday():S.tab==="workout"?vWorkout():S.tab==="meal"?vMeal():vCal();
  Object.entries(vals).forEach(([k,x])=>{const i=document.getElementById(k);if(i)i.value=x});
  if(keep){const i=document.getElementById(keep);if(i&&i.tagName==="INPUT")i.focus()}
}

function workoutLine(w){return w.kind==="cardio"
  ?[w.minutes?w.minutes+"분":"",w.km?w.km+"km":""].filter(Boolean).join(" · ")||"유산소"
  :[w.sets?w.sets+"세트":"",w.reps?w.reps+"회":"",w.kg?w.kg+"kg":""].filter(Boolean).join(" × ")||"근력"}

function waterBlock(x){
  const n=x.water,cups=Math.max(CUP_GOAL,n);let h="";
  for(let i=0;i<cups;i++)h+=`<button class="cup ${i<n?"on":""} ${i>=CUP_GOAL?"extra":""}" data-act="cup" data-i="${i}" aria-label="${i+1}잔"></button>`;
  return `<div class="card"><div class="water-head"><div><span class="muted" style="font-size:13px;font-weight:600">물</span> <span class="big num">${(n*CUP_ML/1000).toFixed(2).replace(/0$/,"")}L</span></div>
  <span class="muted num" style="font-size:13px">${n} / ${CUP_GOAL}잔 · 한 잔 ${CUP_ML}ml</span></div>
  <div class="cups" style="grid-template-columns:repeat(${Math.min(cups,10)},1fr)">${h}</div>
  <div class="water-ctl"><button data-act="water" data-n="-1">한 잔 빼기</button><button class="add" data-act="water" data-n="1">+ 한 잔</button></div></div>`}

function vToday(){
  const x=day(S.date),ws=x.workouts;
  const sets=ws.reduce((a,w)=>a+(+w.sets||0),0),mins=ws.reduce((a,w)=>a+(+w.minutes||0),0);
  const allMeals=MEALS.flatMap(([k])=>x.meals[k]);const kcal=allMeals.reduce((a,m)=>a+(+m.kcal||0),0);
  const filled=MEALS.filter(([k])=>x.meals[k].length).length;
  const slots=MEALS.map(([k,l])=>{const ms=x.meals[k],p=ms.find(m=>photoSrc(m));
    return `<button class="slot ${ms.length?"on":""}" data-act="gomeal" data-slot="${k}"><div class="pic">${p?`<img src="${esc(photoSrc(p))}" alt="">`:ms.length?"✓":"+"}</div>${l}</button>`}).join("");
  return `<div style="display:flex;flex-direction:column;gap:14px">
  <div class="sum-grid">
    <button class="stat w" data-act="tab" data-tab="workout"><span class="k">운동</span><span class="v">${ws.length}<small>종목</small></span><span class="d num">${sets?sets+"세트":""}${sets&&mins?" · ":""}${mins?mins+"분":""}${!sets&&!mins?"아직 기록 없음":""}</span></button>
    <button class="stat m" data-act="tab" data-tab="meal"><span class="k">식단</span><span class="v">${filled}<small>/ 4끼</small></span><span class="d num">${kcal?kcal.toLocaleString()+" kcal":allMeals.length?allMeals.length+"개 기록":"아직 기록 없음"}</span></button>
  </div>
  <div class="card"><div class="slots">${slots}</div></div>
  ${waterBlock(x)}
  <h2 class="sec">오늘 한 운동 <span class="count">${ws.length}</span></h2>
  <div class="card">${ws.length?`<div class="list">${ws.map(w=>`<div class="item"><div class="main"><div class="t">${esc(w.name)}</div><div class="s num">${esc(workoutLine(w))}</div></div><span class="badge">${w.kind==="cardio"?"유산소":"근력"}</span></div>`).join("")}</div>`
    :`<div class="empty">아직 운동 기록이 없어요.</div><button class="primary" data-act="tab" data-tab="workout" style="width:100%;margin-top:6px">운동 기록하기</button>`}</div>
  </div>`}

function recentNames(){const s=new Set();Object.keys(S.days).sort().reverse().forEach(k=>(S.days[k].workouts||[]).forEach(w=>s.add(w.name)));return [...s].slice(0,6)}

function vWorkout(){
  const x=day(S.date),ws=x.workouts,st=S.wType==="strength";
  const names=[...new Set([...recentNames(),...QUICK])].slice(0,10);
  return `<div style="display:flex;flex-direction:column;gap:14px">
  <div class="card"><form class="form" id="wForm">
    <div class="seg" role="group" aria-label="운동 종류"><button type="button" data-act="wtype" data-v="strength" aria-pressed="${st}">근력</button><button type="button" data-act="wtype" data-v="cardio" aria-pressed="${!st}">유산소</button></div>
    <label class="f">운동 이름<input type="text" id="wName" placeholder="예: 스쿼트" autocomplete="off" required></label>
    <div class="chips">${names.map(n=>`<button type="button" class="chip" data-act="wname" data-v="${esc(n)}">${esc(n)}</button>`).join("")}</div>
    ${st?`<div class="row"><label class="f">세트<input type="number" id="wSets" inputmode="numeric" min="0" placeholder="3"></label><label class="f">횟수<input type="number" id="wReps" inputmode="numeric" min="0" placeholder="10"></label><label class="f">무게(kg)<input type="number" id="wKg" inputmode="decimal" min="0" step="0.5" placeholder="40"></label></div>`
        :`<div class="row"><label class="f">시간(분)<input type="number" id="wMin" inputmode="numeric" min="0" placeholder="30"></label><label class="f">거리(km)<input type="number" id="wKm" inputmode="decimal" min="0" step="0.1" placeholder="5"></label></div>`}
    <button class="primary" type="submit">운동 추가</button>
  </form></div>
  <h2 class="sec">이날 운동 <span class="count">${ws.length}</span></h2>
  <div class="card">${ws.length?`<div class="list">${ws.map(w=>`<div class="item"><div class="main"><div class="t">${esc(w.name)}</div><div class="s num">${esc(workoutLine(w))}</div></div><span class="badge">${w.kind==="cardio"?"유산소":"근력"}</span><button class="del" data-act="wdel" data-id="${w.id}" aria-label="삭제">×</button></div>`).join("")}</div>`:`<div class="empty">위에서 첫 운동을 추가해 보세요.</div>`}</div>
  </div>`}

function vMeal(){
  const x=day(S.date),k=S.mealSlot,ms=x.meals[k],lbl=MEALS.find(m=>m[0]===k)[1];
  const tabs=MEALS.map(([key,l])=>`<button data-act="mslot" data-v="${key}" aria-pressed="${key===k}">${l}<span class="n">${x.meals[key].length||""}</span></button>`).join("");
  return `<div style="display:flex;flex-direction:column;gap:14px">
  <div class="meal-tabs" role="group" aria-label="끼니">${tabs}</div>
  <div class="card"><form class="form" id="mForm">
    <label class="f">${lbl}에 먹은 것<input type="text" id="mText" placeholder="예: 닭가슴살 샐러드" autocomplete="off"></label>
    <div class="row"><label class="f">칼로리(선택)<input type="number" id="mKcal" inputmode="numeric" min="0" placeholder="kcal"></label><label class="f">단백질(선택)<input type="number" id="mProt" inputmode="numeric" min="0" placeholder="g"></label></div>
    <div class="photo-pick">${S.pendingPhoto?`<img class="pv" src="${S.pendingPhoto.dataUrl}" alt="선택한 사진">`:""}
      <label class="btn" for="mPhoto">${S.pendingPhoto?"사진 바꾸기":"📷 사진 첨부"}</label><input type="file" id="mPhoto" accept="image/*">
      ${S.pendingPhoto?`<button type="button" class="del" data-act="clearphoto" aria-label="사진 빼기">×</button>`:""}</div>
    <button class="primary meal" type="submit" ${S.busy?"disabled":""}>${S.busy?"사진 올리는 중…":lbl+" 추가"}</button>
  </form></div>
  <h2 class="sec">${lbl} <span class="count">${ms.length}</span></h2>
  <div class="card">${ms.length?`<div class="list">${ms.map(m=>`<div class="item">${photoSrc(m)?`<button class="thumb" data-act="zoom" data-src="${esc(photoSrc(m))}" aria-label="사진 크게 보기"><img src="${esc(photoSrc(m))}" alt=""></button>`:""}<div class="main"><div class="t">${esc(m.text||"사진 기록")}</div><div class="s num">${[m.kcal?m.kcal+" kcal":"",m.prot?"단백질 "+m.prot+"g":""].filter(Boolean).join(" · ")}</div></div><button class="del" data-act="mdel" data-id="${m.id}" aria-label="삭제">×</button></div>`).join("")}</div>`:`<div class="empty">${lbl} 기록이 없어요. 메뉴를 적거나 사진만 올려도 돼요.</div>`}</div>
  ${waterBlock(x)}
  </div>`}

function vCal(){
  const base=S.calMonth||S.date.slice(0,7);const[y,mo]=base.split("-").map(Number);
  const first=new Date(y,mo-1,1),n=new Date(y,mo,0).getDate(),today=ymd(new Date());
  let cells=DOW.map(d=>`<div class="dow">${d}</div>`).join("");
  for(let i=0;i<first.getDay();i++)cells+=`<div class="day out"></div>`;
  let wd=0,md=0,hd=0;
  for(let i=1;i<=n;i++){const k=y+"-"+String(mo).padStart(2,"0")+"-"+String(i).padStart(2,"0"),x=day(k);
    const w=x.workouts.length>0,m=MEALS.some(([q])=>x.meals[q].length),h=x.water>=CUP_GOAL;wd+=w;md+=m;hd+=h;
    cells+=`<button class="day ${k===S.date?"sel":""} ${k===today?"today":""}" data-act="pick" data-d="${k}" aria-label="${mo}월 ${i}일"><span>${i}</span><span class="dots">${w?'<i class="dot w"></i>':""}${m?'<i class="dot m"></i>':""}${h?'<i class="dot h"></i>':""}</span></button>`}
  return `<div style="display:flex;flex-direction:column;gap:14px">
  <div class="card"><div class="cal-head"><button class="iconbtn" data-act="mon" data-n="-1" aria-label="이전 달">‹</button><b>${y}년 ${mo}월</b><button class="iconbtn" data-act="mon" data-n="1" aria-label="다음 달">›</button></div>
  <div class="cal">${cells}</div>
  <div class="legend"><span><i class="dot w"></i>운동</span><span><i class="dot m"></i>식단</span><span><i class="dot h"></i>물 ${CUP_GOAL}잔 달성</span></div></div>
  <div class="card month-stats"><div><b class="num" style="color:var(--accent)">${wd}</b><span>운동한 날</span></div><div><b class="num" style="color:var(--meal)">${md}</b><span>식단 기록한 날</span></div><div><b class="num" style="color:var(--water)">${hd}</b><span>물 목표 달성</span></div></div>
  <p class="muted" style="font-size:13px;margin:0">날짜를 누르면 그날 기록으로 이동해요.</p>
  </div>`}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act],[data-tab]");if(!t)return;
  if(t.closest("nav.tabs")){S.tab=t.dataset.tab;render();scrollTo(0,0);return}
  const a=t.dataset.act;
  if(a==="tab"){S.tab=t.dataset.tab;render();scrollTo(0,0)}
  else if(a==="gomeal"){S.mealSlot=t.dataset.slot;S.tab="meal";render();scrollTo(0,0)}
  else if(a==="cup"){const i=+t.dataset.i;mutate(x=>{x.water=x.water===i+1?i:i+1},500)}
  else if(a==="water"){mutate(x=>{x.water=Math.max(0,Math.min(20,x.water+(+t.dataset.n)))},500)}
  else if(a==="wtype"){S.wType=t.dataset.v;render()}
  else if(a==="wname"){const i=$("#wName");i.value=t.dataset.v;if(CARDIO.has(t.dataset.v)!==(S.wType==="cardio")){S.wType=CARDIO.has(t.dataset.v)?"cardio":"strength";render()}}
  else if(a==="wdel"){mutate(x=>{x.workouts=x.workouts.filter(w=>w.id!==t.dataset.id)})}
  else if(a==="mslot"){S.mealSlot=t.dataset.v;render()}
  else if(a==="clearphoto"){S.pendingPhoto=null;render()}
  else if(a==="mdel"){let gone;mutate(x=>{const l=x.meals[S.mealSlot];gone=l.find(m=>m.id===t.dataset.id);x.meals[S.mealSlot]=l.filter(m=>m.id!==t.dataset.id)});
    if(gone&&gone.photoId&&S.assets)S.assets.delete(gone.photoId).catch(()=>{})}
  else if(a==="zoom"){const o=document.createElement("div");o.className="overlay";o.innerHTML=`<img src="${esc(t.dataset.src)}" alt="식단 사진">`;o.onclick=()=>o.remove();document.body.appendChild(o)}
  else if(a==="pick"){S.date=t.dataset.d;S.tab="today";render();scrollTo(0,0)}
  else if(a==="mon"){const[y,m]=(S.calMonth||S.date.slice(0,7)).split("-").map(Number);const d=new Date(y,m-1+(+t.dataset.n),1);S.calMonth=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");render()}
});
$("#prevDay").onclick=()=>{S.date=shift(S.date,-1);S.calMonth=null;render()};
$("#nextDay").onclick=()=>{S.date=shift(S.date,1);S.calMonth=null;render()};
$("#goToday").onclick=()=>{S.date=ymd(new Date());S.calMonth=null;render()};

document.addEventListener("change",async e=>{
  if(e.target.id!=="mPhoto"||!e.target.files[0])return;
  try{S.pendingPhoto=Object.assign(await shrink(e.target.files[0],1024,.8),{});render()}
  catch(_){toast("이 사진은 열 수 없어요. 다른 사진을 골라 주세요")}
});

document.addEventListener("submit",async e=>{
  e.preventDefault();
  if(e.target.id==="wForm"){
    const name=$("#wName").value.trim();if(!name){$("#wName").focus();return}
    const w={id:uid(),name,kind:S.wType};
    if(S.wType==="strength"){w.sets=+$("#wSets").value||0;w.reps=+$("#wReps").value||0;w.kg=+$("#wKg").value||0}
    else{w.minutes=+$("#wMin").value||0;w.km=+$("#wKm").value||0}
    e.target.reset();document.activeElement.blur();
    mutate(x=>x.workouts.push(w));toast(name+" 추가됨");
  }
  if(e.target.id==="mForm"){
    const text=$("#mText").value.trim(),kcal=+$("#mKcal").value||0,prot=+$("#mProt").value||0;
    if(!text&&!S.pendingPhoto){$("#mText").focus();toast("메뉴를 적거나 사진을 골라 주세요");return}
    const m={id:uid(),text,kcal,prot},slot=S.mealSlot,d=S.date,ph=S.pendingPhoto;
    if(ph){
      if(S.mode==="db"&&S.assets){S.busy=true;render();
        try{const r=await S.assets.upload(ph.blob,{type:"image/jpeg"});m.photoId=r.id;m.photoUrl=r.url}
        catch(err){S.busy=false;render();toast("사진을 올리지 못했어요. 다시 시도해 주세요");return}
        S.busy=false}
      else m.photoData=ph.dataUrl;
    }
    S.pendingPhoto=null;
    ["mText","mKcal","mProt"].forEach(id=>{const i=document.getElementById(id);if(i)i.value=""});
    const prev=S.date;S.date=d;mutate(x=>x.meals[slot].push(m));S.date=prev;render();
    toast("기록했어요");
  }
});

init();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
</script>
</body>
</html>
